name: Portfolio checks
on:
  push:
    branches: [portfolio-v2-projects, main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: |
          for f in script.js math-lab.js math-extras.js ml-lab.js nlp-lab.js; do node --check "$f"; done
          node --input-type=module --check < sql-lab.js
